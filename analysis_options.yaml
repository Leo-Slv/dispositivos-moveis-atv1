include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
    - prefer_final_locals
    - prefer_final_fields
    - avoid_print
    - always_declare_return_types
    - directives_ordering
