services:
  flutter:
    build: .
    image: atv1-flutter
    working_dir: /app
    volumes:
      - .:/app
      # Saídas de build fora da pasta do Windows (o bind mount é lento com elas).
      - build-saida:/app/build
      - dart-tool:/app/.dart_tool
      - pub-cache:/pub-cache
      - gradle-cache:/root/.gradle
    stdin_open: true
    tty: true
    command: bash

  # Format (checagem), analyze e testes: docker compose run --rm qa
  qa:
    build: .
    image: atv1-flutter
    working_dir: /app
    volumes:
      - .:/app
      - build-saida:/app/build
      - dart-tool:/app/.dart_tool
      - pub-cache:/pub-cache
      - gradle-cache:/root/.gradle
    command: sh scripts/qa.sh

volumes:
  build-saida:
  dart-tool:
  pub-cache:
  gradle-cache:
